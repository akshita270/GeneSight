services:
  - type: web
    name: genomics-ai-api
    runtime: python
    buildCommand: >
      pip install --upgrade pip &&
      pip install spacy==3.7.2 &&
      pip install scispacy==0.5.4 &&
      pip install https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_ner_bc5cdr_md-0.5.4.tar.gz &&
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ENTREZ_EMAIL
        sync: false
      - key: ENTREZ_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: PUBMED_MAX_RESULTS
        value: "50"
      - key: HYPOTHESIS_MAX
        value: "5"